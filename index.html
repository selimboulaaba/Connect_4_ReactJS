<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Connect 4: Play online with friends</title>
    <meta name="description" content="Play Connect 4 online with friends, against the computer, or on one device. Daily puzzles, tournaments and a leaderboard." />
    <meta name="theme-color" content="#1F4FD8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Titan+One&display=swap" rel="stylesheet" />
    <script>
      // Theme: "system" (default) follows the device; "light"/"dark" are manual overrides.
      ;(function () {
        var pref = 'system'
        try { pref = localStorage.getItem('theme') || 'system' } catch (e) {}
        var mq = window.matchMedia('(prefers-color-scheme: dark)')
        var apply = function () {
          var p = 'system'
          try { p = localStorage.getItem('theme') || 'system' } catch (e) {}
          document.documentElement.dataset.theme = p === 'system' ? (mq.matches ? 'dark' : 'light') : p
        }
        apply()
        mq.addEventListener('change', apply)
        window.__applyTheme = apply
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
